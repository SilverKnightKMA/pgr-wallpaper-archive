name: Cleanup

on:
  workflow_dispatch:
    inputs:
      delete_releases:
        description: 'ALSO delete ALL releases and tags (irreversible)'
        type: boolean
        default: false
      delete_data_dirs:
        description: 'ALSO delete data/ and preview/ from main (REMOVES manifest.json!)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      # Protected branches are NEVER deleted: main + the archive branches
      # declared in config.json (wallpapersBranch / previewBranch) which hold
      # the entire ~22 GB image archive with no other copy anywhere.
      - name: Delete unprotected branches only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 -c "import json; c=json.load(open('config.json')); print('main'); print(c.get('wallpapersBranch','wallpapers')); print(c.get('previewBranch','preview'))" > /tmp/protected_branches.txt
          echo "Protected branches:"
          cat /tmp/protected_branches.txt
          branches=$(gh api "repos/${{ github.repository }}/branches" --paginate -q '.[].name' | grep -vxF -f /tmp/protected_branches.txt) || true
          if [ -z "$branches" ]; then
            echo "No branches to delete."
          else
            for branch in $branches; do
              echo "Deleting branch: $branch"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$branch" 2>/dev/null || true
            done
          fi

      - name: Delete data and preview directories (opt-in)
        if: ${{ inputs.delete_data_dirs }}
        run: |
          deleted=false
          for dir in data preview; do
            if [ -d "$dir" ]; then
              git rm -rf "$dir"
              deleted=true
              echo "Staged $dir for deletion."
            fi
          done
          if [ "$deleted" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: remove data and preview directories"
            git push origin main
          else
            echo "No directories to delete."
          fi

      - name: Delete all releases (opt-in)
        if: ${{ inputs.delete_releases }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 1000 --json tagName -q '.[].tagName' | \
            xargs -P 10 -I {} sh -c 'echo "Deleting release: {}" && gh release delete "{}" --yes --cleanup-tag' || true
          echo "All releases deleted."

      - name: Delete all Git tags (opt-in)
        if: ${{ inputs.delete_releases }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh api repos/${{ github.repository }}/tags --paginate -q '.[].name') || true
          if [ -z "$tags" ]; then
            echo "No tags to delete."
          else
            count=$(echo "$tags" | wc -l)
            echo "Deleting $count tags..."
            for tag in $tags; do
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
            done
          fi
