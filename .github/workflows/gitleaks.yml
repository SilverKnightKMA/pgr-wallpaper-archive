name: gitleaks

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One scan per ref at a time; a newer run supersedes an older one on the same ref
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Default fetch-depth (1): downloads only the commit(s) to scan (~MBs).
      # NEVER use fetch-depth: 0 here — it fetches ALL branches including the
      # multi-GB wallpapers/preview image branches, while gitleaks itself only
      # scans the pushed commit / PR range (2-4s).
      - uses: actions/checkout@v7
      # gitleaks scans the commit RANGE (before..head on push, base..head on
      # PR). checkout@v7 default (depth 1) is shallow, so the base commit is
      # missing and gitleaks fails. Unshallow ONLY the checked-out ref via an
      # explicit refspec — verified ~3s / 2.5MB for main. NEVER run a bare
      # `git fetch --unshallow origin`: without a refspec it downloads every
      # branch, i.e. the ~21GB image branches.
      - name: Fetch full history for this ref
        run: git fetch --unshallow origin "${GITHUB_REF}"
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
